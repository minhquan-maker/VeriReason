# Pilot configuration on Statlog German Credit (fast iteration; also used by FAX).
# Every stage reads this file; outputs go to runs/<run_name>/.

run_name: german_pilot
seed: 13

dataset:
  name: german
  path: data/raw/german.data
  url: https://archive.ics.uci.edu/ml/machine-learning-databases/statlog/german/german.data
  test_size: 0.3

schema: configs/schemas/german.yaml

models:
  xgb:
    type: xgboost
    params: {n_estimators: 200, max_depth: 3, learning_rate: 0.05, min_child_weight: 5,
             reg_lambda: 5.0, subsample: 0.9, colsample_bytree: 0.9}
  lr:
    type: logistic
    params: {C: 1.0}

decision:
  # tau is set so that this share of the held-out split is denied (Home Credit / German Credit have
  # no real decisions; the denial policy is simulated and must be reported in the paper).
  denial_rate: 0.30

pilot:
  n_denied: 200            # capped by the number of denied applicants available

verifier:
  samplers: [knn, marginal, median, approved]   # first one is the primary reference
  n_samples: 200           # S in proposal §2.1
  knn_k: 50
  z: 1.96                  # CI width used for the MC-SE part of epsilon
  min_effect: 0.01         # minimum |Delta_g| in probability units — placeholder, fix on a dev split
  top_k: 4                 # Reg. B commentary: more than four reasons not likely helpful

generation:
  backends:
    - {name: dummy, backend: dummy}
    # - {name: claude-opus-5-5, backend: anthropic, model: claude-opus-5-5}
    # - {name: qwen-7b, backend: openai_compat, model: Qwen/Qwen2.5-7B-Instruct}
    # - {name: llama-70b, backend: openai_compat, model: meta-llama/Llama-3.3-70B-Instruct}
  setups: [raw, shap, shap_groups]
  samples_per_applicant: 1
  temperature: 0.7         # ignored by backends that do not accept sampling parameters
  max_tokens: 1024

extraction:
  backend: keyword         # keyword (offline heuristic) | anthropic | openai_compat
  # model: claude-opus-5-5
  max_tokens: 4096
